services:
  - type: web
    name: whatsapp-disparo-panel
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn panel.server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PANEL_USERNAME
        sync: false
      - key: PANEL_PASSWORD
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EVOLUTION_API_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: INSTANCE_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
